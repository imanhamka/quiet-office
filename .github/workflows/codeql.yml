name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read          # the analyze step reads its own workflow run
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Swift is not scanned: CodeQL needs a macOS runner and a traced swiftc build for it.
        # C# runs with build-mode none, so the Windows host is scanned without a Windows build.
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: csharp
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - web/dist
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
