name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/pixel-agents/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web/pixel-agents
      - run: npm test
        working-directory: web/pixel-agents
      - run: npm run build
        working-directory: web/pixel-agents
      - run: node --test server/test/
      - name: Package web dist
        run: cd web && zip -qr "../quiet-office-web-dist-${GITHUB_REF_NAME}.zip" dist
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: quiet-office-web-dist-*.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/macos/build-host.sh
      - name: Package ad-hoc signed app
        run: ditto -c -k --keepParent hosts/macos/build/QuietOffice.app "quiet-office-macos-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: quiet-office-macos-*.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish hosts/windows/QuietOffice.csproj -c Release -r win-x64 --self-contained false -o out/windows
      - name: Package publish output
        shell: pwsh
        run: Compress-Archive -Path out/windows/* -DestinationPath "quiet-office-windows-$env:GITHUB_REF_NAME.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: quiet-office-windows-*.zip

  release:
    needs: [web, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Quiet Office $GITHUB_REF_NAME" \
            --generate-notes --verify-tag $prerelease
