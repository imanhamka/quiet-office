version: 2
updates:
  - package-ecosystem: npm
    directory: /web/pixel-agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades of the trimmed upstream fork are done by hand, with the tests.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directories:
      - /hosts/windows
      - /hosts/windows.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major upgrades of the trimmed upstream fork are done by hand, with the tests.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
